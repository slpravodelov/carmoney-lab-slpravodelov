services:
  backend-dotnet:
    build:
      context: .
      dockerfile: dotnet/CarMoneyLab.Api/Dockerfile
    environment:
      ConnectionStrings__MySql: Server=db;Port=3306;Database=carmoney_lab;User ID=lab;Password=lab
    ports:
      - "${DOTNET_APP_PORT:-8081}:8080"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: carmoney_lab
      MYSQL_USER: lab
      MYSQL_PASSWORD: lab
      MYSQL_ROOT_PASSWORD: lab-root
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - dotnet-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ulab", "-plab"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  dotnet-db-data:
